<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Hyperneuron AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAFAFA] text-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
  <div class="w-full max-w-md bg-white border border-slate-200/90 rounded-2xl shadow-sm p-8">
    <div class="flex flex-col items-center text-center mb-6">
      <div class="w-12 h-12 rounded-2xl bg-violet-600 flex items-center justify-center text-white shadow-sm mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 19V9m5 10V5m5 14v-7m5 7V8"/>
        </svg>
      </div>
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold tracking-tight text-slate-900">Hyperneuron</h1>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-violet-100 text-violet-700">AI</span>
      </div>
      <p class="text-xs text-slate-500 mt-1" id="plane-label">Sovereign Multi-Agent Intelligence Platform</p>
    </div>

    <div id="error-box" class="hidden mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs"></div>

    <!-- Google SSO Button -->
    <a id="google-sso-btn" href="/auth/google" class="w-full flex items-center justify-center gap-3 px-4 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm transition shadow-2xs">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
        <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
      </svg>
      Continue with Google SSO
    </a>

    <div class="relative my-5">
      <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
      <div class="relative flex justify-center text-xs"><span class="bg-white px-3 text-slate-400">or sign in with credentials</span></div>
    </div>

    <!-- Local / Admin Login Form -->
    <form action="/auth/login" method="POST" class="space-y-4">
      <input type="hidden" name="next_url" id="next-url-input" value="/" />
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Username or Email</label>
        <input type="text" name="username" required placeholder="admin" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500" />
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-500" />
      </div>
      <button type="submit" class="w-full py-2.5 px-4 rounded-xl bg-violet-600 hover:bg-violet-700 text-white font-medium text-sm transition cursor-pointer">
        Sign In
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
      <span>Default Admin: <code class="text-slate-600 font-semibold">admin / admin</code></span>
      <a href="http://localhost:8000" class="text-violet-600 hover:underline">Public UI (:8000)</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get("error");
    const next = params.get("next") || "/";
    if (err) {
      const box = document.getElementById("error-box");
      box.textContent = err;
      box.classList.remove("hidden");
    }
    document.getElementById("next-url-input").value = next;
    document.getElementById("google-sso-btn").href = `/auth/google?next_url=${encodeURIComponent(next)}`;
    document.getElementById("plane-label").textContent = `Connected Plane: ${window.location.host}`;
  </script>
</body>
</html>
