services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hyperneuron
      POSTGRES_USER: hyperneuron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyperneuron_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperneuron -d hyperneuron"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hyperneuron:${POSTGRES_PASSWORD:-hyperneuron_dev_only}@postgres:5432/hyperneuron
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  user-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3000"]
    env_file: .env
    environment:
      CONSOLE_SECTION: user
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

  orchestrator-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3001"]
    env_file: .env
    environment:
      CONSOLE_SECTION: orchestrator
    ports: ["3001:3001"]
    depends_on: [api]
    restart: unless-stopped

  agents-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3002"]
    env_file: .env
    environment:
      CONSOLE_SECTION: agents
    ports: ["3002:3002"]
    depends_on: [api]
    restart: unless-stopped

  database-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3003"]
    env_file: .env
    environment:
      CONSOLE_SECTION: database
    ports: ["3003:3003"]
    depends_on: [api]
    restart: unless-stopped

  security-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3004"]
    env_file: .env
    environment:
      CONSOLE_SECTION: security
    ports: ["3004:3004"]
    depends_on: [api]
    restart: unless-stopped

  governance-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3005"]
    env_file: .env
    environment:
      CONSOLE_SECTION: governance
    ports: ["3005:3005"]
    depends_on: [api]
    restart: unless-stopped

  monitoring-ui:
    build: .
    command: ["uvicorn", "backend.console:app", "--host", "0.0.0.0", "--port", "3006"]
    env_file: .env
    environment:
      CONSOLE_SECTION: monitoring
    ports: ["3006:3006"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
